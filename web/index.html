<!doctype html>
<html lang="zh-CN" class="is-booting">
<head>
<meta charset="UTF-8"/>
<base href="/"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0c12" media="(prefers-color-scheme: dark)"/>
<meta name="theme-color" content="#06080e"/>
<title>云星 · CloudStar</title>
<link rel="icon" href="/img/favicon.png" type="image/png" sizes="32x32"/>
<link rel="apple-touch-icon" href="/img/favicon.png"/>
<meta name="description" content="云星（Cloud Star）是 Minecraft: Java Edition 社区服务器：自定义内容、稳定联机与官方 QQ 群。加入冒险：cloudstarmc.cn"/>
<meta property="og:title" content="云星 Minecraft 服务器"/>
<meta property="og:site_name" content="云星"/>
<meta property="og:description" content="自定义内容、稳定联机与活跃社区。复制 IP 加入 cloudstarmc.cn"/>
<link rel="stylesheet" href="https://use.typekit.net/bhe1eni.css"/>
<link rel="stylesheet" href="css/style.css?v=20260446"/><link rel="stylesheet" href="css/overhaul.css?v=20260446"/>
</head>
<body class="font-proxima is-booting">
<div id="page-loader" class="page-loader" aria-busy="true" aria-live="polite" role="status">
<div class="page-loader__backdrop" aria-hidden="true"></div>
<div class="page-loader__content">
<div class="page-loader__mark">云星</div>
<div class="page-loader__orbit" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="page-loader__bar" aria-hidden="true"><span class="page-loader__bar-fill"></span></div>
<p class="page-loader__hint">正在载入</p>
</div>
</div>
<div class="noise" aria-hidden="true"></div>
<div class="cursor-follow" id="cursorCloud" aria-hidden="true">STAR</div>
<div class="atmospheric-bg" id="atmosphericBg" aria-hidden="true">
<div class="atmospheric-bg__particles" id="atmosphericParticles"></div>
<div class="atmospheric-bg__clouds">
<div class="atmospheric-bg__cloud atmospheric-bg__cloud--1"></div>
<div class="atmospheric-bg__cloud atmospheric-bg__cloud--2"></div>
<div class="atmospheric-bg__cloud atmospheric-bg__cloud--3"></div>
<div class="atmospheric-bg__cloud atmospheric-bg__cloud--4"></div>
</div>
</div>
<div class="site-sky" id="siteSky" aria-hidden="true">
<div class="site-sky__stars" id="siteStars"></div>
<canvas class="site-sky__falling" id="siteSkyFalling" width="300" height="300"></canvas>
</div>
<header class="nav" id="nav">
<div class="nav__inner">
<a href="/home" class="nav__brand" data-route="home" aria-label="云星 Cloud Star 主页">
<img class="nav__brand-img" src="img/brand-logo.png" width="256" height="128" alt="云星 Cloud Star MC" decoding="async"/>
<span class="nav__brand-word" aria-hidden="true">CLOUD STAR</span>
</a>
<div class="nav__drawer" id="navDrawer">
<nav class="nav__links nav__shell" aria-label="主导航">
<div class="nav__primary">
<a href="/home" class="nav__route nav__route--main is-active" data-route="home" aria-current="page">主页</a>
<a href="/wiki" class="nav__route nav__route--main" data-route="wiki" aria-current="false">百科</a>
<a href="/events" class="nav__route nav__route--main" data-route="events" aria-current="false">事件</a>
</div>
<div class="nav__sub-slot" id="navSubSlot" aria-live="polite">
<div id="navWikiAnchors" class="nav__sub nav__sub--wiki" aria-hidden="true"></div>
</div>
</nav>
</div>
<button class="nav__burger" type="button" id="navToggle" aria-controls="navDrawer" aria-expanded="false" aria-label="打开菜单">
<span class="nav__burger-line"></span><span class="nav__burger-line"></span><span class="nav__burger-line"></span>
</button>
</div>
</header>
<main class="app-main view-state--home" id="app-main">
<div id="view-home" class="view view--home view--active"></div>
<div id="view-wiki" class="view view--wiki"></div>
<div id="view-events" class="view view--events"></div>
</main>
<aside id="wikiTocPanel" class="wiki-toc" aria-label="本页目录" hidden>
<div class="wiki-toc__title">目录</div>
<nav class="wiki-toc__list" id="wikiTocNav"></nav>
</aside>
<aside id="eventsTocPanel" class="wiki-toc wiki-toc--events" aria-label="事件索引" hidden>
<div class="wiki-toc__title">索引</div>
<nav class="wiki-toc__list wiki-toc__list--events" id="eventsTocNav"></nav>
</aside>
<footer class="footer"><div class="footer__inner"><div class="footer__row"><span>© 云星 Cloud Star Realms</span><div class="footer__links"><a href="#">反馈</a></div></div></div></footer>
<script type="module" src="js/main.js"></script>
</body>
</html>
